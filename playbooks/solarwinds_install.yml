---
################################################################################
# PLAY 1: Bootstrap (Required for dynamic inventory from Cloud Studio)
################################################################################
- name: Bootstrap newly provisioned host
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add provisioned VM to inventory
      add_host:
        name: "{{ provisioned_hostname }}"
        ansible_host: "{{ provisioned_ip }}"
        groups: >-
          {{
            'windows' if provisioned_os | lower in ['windows', 'win', 'windows_server']
            else 'linux'
          }}

################################################################################
# PLAY 2: Direct Installation (The Simplified Path)
################################################################################
- name: SolarWinds Agent Installation
  hosts: all
  gather_facts: false
  
  tasks:
    # 1. Wait for connection (Replaces the failing solarwinds_common role)
    - name: Ensure VM is reachable and ready
      ansible.builtin.wait_for_connection:
        timeout: 5

    # 2. Automatically discover OS facts
    - name: Gather facts
      ansible.builtin.setup:

    # 3. Run OS-specific installation roles
    - name: Run Windows Installation
      include_role:
        name: solarwinds_windows
      when: ansible_os_family == "Windows"

    - name: Run Linux Installation
      include_role:
        name: solarwinds_linux
      when: ansible_os_family != "Windows"

    # 4. Final Validation
    - name: Verify SolarWinds Agent
      include_role:
        name: solarwinds_validate


