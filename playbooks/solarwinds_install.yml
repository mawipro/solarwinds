---
################################################################################
# PLAY 1: Bootstrap dynamic inventory from provisioning output
################################################################################
- name: Bootstrap newly provisioned host
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Fail if provisioned OS is unsupported
      assert:
        that:
          - provisioned_os is defined
          - provisioned_os | lower in ['windows', 'win', 'windows_server', 'linux']
        fail_msg: >
          Unsupported or missing provisioned_os '{{ provisioned_os }}'.
          Expected one of: windows, win, windows_server, linux.

    - name: Add provisioned VM to inventory
      add_host:
        name: "{{ provisioned_hostname }}"
        ansible_host: "{{ provisioned_ip }}"
        groups: >-
          {{
            'windows' if provisioned_os | lower in ['windows', 'win', 'windows_server']
            else 'linux'
          }}

    - name: Show dynamic inventory classification
      debug:
        msg:
          - "Host: {{ provisioned_hostname }}"
          - "ansible_host: {{ hostvars[provisioned_hostname].ansible_host }}"
          - "Groups: {{ hostvars[provisioned_hostname].group_names }}"


################################################################################
# TEST PLAY: Print Credentials and Variables
################################################################################
- name: Test - Print all variables and credentials
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Print vCenter VMware Credentials
      debug:
        msg:
          - "=== vCenter VMware Credentials ==="
          - "vcenter_vmware_cred: {{ vcenter_vmware_cred | default('NOT SET') }}"
      when: vcenter_vmware_cred is defined

    - name: Print SolarWinds Credentials
      debug:
        msg:
          - "=== SolarWinds Credentials ==="
          - "solarwinds_cred: {{ solarwinds_cred | default('NOT SET') }}"
      when: solarwinds_cred is defined

    - name: Print all variables (to debug)
      debug:
        msg:
          - "=== All Available Variables ==="
          - "{{ vars | dict2items | map(attribute='key') | list }}"

    - name: Print ansible_user if defined
      debug:
        msg: "ansible_user: {{ ansible_user }}"
      when: ansible_user is defined

    - name: Print provisioned hostname details
      debug:
        msg:
          - "provisioned_hostname: {{ provisioned_hostname | default('NOT SET') }}"
          - "provisioned_ip: {{ provisioned_ip | default('NOT SET') }}"
          - "provisioned_os: {{ provisioned_os | default('NOT SET') }}"


