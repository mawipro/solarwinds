---
################################################################################
# PLAY 1: Bootstrap dynamic inventory from provisioning output
################################################################################
- name: Bootstrap newly provisioned host
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Fail if provisioned OS is unsupported
      assert:
        that:
          - provisioned_os is defined
          - provisioned_os | lower in ['windows', 'win', 'windows_server', 'linux']
        fail_msg: >
          Unsupported or missing provisioned_os '{{ provisioned_os }}'.
          Expected one of: windows, win, windows_server, linux.

    - name: Add provisioned VM to inventory
      add_host:
        name: "{{ provisioned_hostname }}"
        ansible_host: "{{ provisioned_ip }}"
        groups: >-
          {{
            'windows' if provisioned_os | lower in ['windows', 'win', 'windows_server']
            else 'linux'
          }}

    - name: Show dynamic inventory classification
      debug:
        msg:
          - "Host: {{ provisioned_hostname }}"
          - "ansible_host: {{ hostvars[provisioned_hostname].ansible_host }}"
          - "Groups: {{ hostvars[provisioned_hostname].group_names }}"


################################################################################
# PLAY 2: Pre-flight checks
################################################################################
- name: Run pre-flight checks
  hosts: all
  gather_facts: false
  roles:
    - solarwinds_common

################################################################################
# PLAY 3: Copy binaries from vSphere datastore
################################################################################
- name: Copy SolarWinds binaries from datastore
  hosts: localhost
  gather_facts: false
  roles:
    - solarwinds_cp_from_ds

################################################################################
# PLAY 4: OS-specific installation
################################################################################
- name: Install SolarWinds on Windows
  hosts: windows
  gather_facts: false
  roles:
    - solarwinds_windows

- name: Install SolarWinds on Linux
  hosts: linux
  gather_facts: false
  roles:
    - solarwinds_linux

################################################################################
# PLAY 5: Post-install validation
################################################################################
- name: Validate SolarWinds agent
  hosts: localhost
  gather_facts: false
  roles:
    - solarwinds_validate